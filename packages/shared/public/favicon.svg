<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="zylo-gradient" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="zylo-handle" x1="24" y1="6" x2="40" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="zylo-arrow" x1="36" y1="18" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
  </defs>

  <!-- Clean Light White Rounded Container with Soft Border -->
  <rect width="64" height="64" rx="16" fill="#FFFFFF" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#E2E8F0" stroke-width="2" />

  <!-- Bag Handle -->
  <path d="M25 18 V12 C25 8.5 28 6 32 6 C36 6 39 8.5 39 12 V18" stroke="url(#zylo-handle)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Geometric Z Bag Body -->
  <path d="M17 19 H47 L41 27 H17 L17 19 Z" fill="url(#zylo-gradient)" />
  <path d="M17 42 L38 20 H48 L27 50 H17 V42 Z" fill="url(#zylo-gradient)" />
  
  <!-- Vibrant Growth Arrow Accent -->
  <polygon points="38,18 52,18 52,32 46,26 42,23" fill="url(#zylo-arrow)" />

  <!-- Base Foundation -->
  <path d="M23 42 H47 L42 50 H23 V42 Z" fill="url(#zylo-gradient)" />
</svg>
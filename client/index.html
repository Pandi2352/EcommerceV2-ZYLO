<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYLO — Next-Gen E-Commerce Platform</title>

    <!-- Favicon & Branding -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0F172A" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="ZYLO is a high-performance, modular e-commerce platform built with React 19, Vite, Tailwind CSS v4, NestJS 12, and MongoDB."
    />
    <meta name="keywords" content="ZYLO, ecommerce, online shopping, electronics, fashion, modern store" />
    <meta name="author" content="ZYLO Engineering" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZYLO" />
    <meta property="og:title" content="ZYLO — Next-Gen E-Commerce Platform" />
    <meta
      property="og:description"
      content="Experience seamless shopping with ZYLO's curated catalog, lightning-fast search, and secure checkout."
    />
    <meta property="og:image" content="/zylo-logo.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZYLO — Next-Gen E-Commerce Platform" />
    <meta
      name="twitter:description"
      content="Experience seamless shopping with ZYLO's curated catalog, lightning-fast search, and secure checkout."
    />
    <meta name="twitter:image" content="/zylo-logo.jpg" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
